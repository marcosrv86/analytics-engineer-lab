version: 2

models:
  - name: stg_extraccion_pozos
    description: "Modelo de staging para la volumetría diaria de pozos petroleros."
    columns:
      - name: id_pozo
        description: "Clave primaria del pozo de extracción."
        tests:
          - unique
          - not_null
      - name: barriles_extraidos
        description: "Volumen bruto extraído (en barriles)."
        tests:
          - not_null